name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, ${{ matrix.distribution }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            distribution: auto
            distribution-check: bash
          - os: windows-latest
            distribution: auto
            distribution-check: cmd
          - os: windows-latest
            distribution: bash
            distribution-check: bash
          - os: macos-latest
            distribution: auto
            distribution-check: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install DoomTools
        id: setup
        uses: ./
        with:
          distribution: ${{ matrix.distribution }}

      - name: Check Action Outputs
        shell: bash
        env:
          VERSION: ${{ steps.setup.outputs.version }}
          DISTRIBUTION: ${{ steps.setup.outputs.distribution }}
        run: |
          test -n "$VERSION"
          test "$DISTRIBUTION" = "${{ matrix.distribution-check }}"
          echo "Installed DoomTools $VERSION ($DISTRIBUTION)"

      - name: Print DoomTools version
        run: doomtools --version

      - name: Print DoomTools environment
        run: doomtools --env
